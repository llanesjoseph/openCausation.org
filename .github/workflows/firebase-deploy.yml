name: Deploy to Firebase Hosting

# Cloud-side auto-deploy on every push to main.
#
# Auth uses Workload Identity Federation: GitHub mints a short-lived OIDC
# token, Google exchanges it for credentials impersonating github-deployer@.
# Nothing long-lived is stored — there is no secret to expire, rotate or leak,
# which is what repeatedly broke deploys under the previous FIREBASE_TOKEN.
#
# Service-account KEYS are blocked by org policy (iam.disableServiceAccountKeyCreation);
# WIF is the sanctioned alternative and creates no key.
#
# The trust is scoped to this repo alone, by attribute condition on the provider:
#   assertion.repository == 'llanesjoseph/openCausation.org'
# id-token: write below is what lets the job request the OIDC token at all.

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: read
  id-token: write           # required for WIF; without it auth fails

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1025450513234/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@opencausationorg.iam.gserviceaccount.com

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pinned: firebase-tools 15.22.2 regressed ADC/WIF auth and the CLI fails
      # with "Failed to authenticate, have you run firebase login?" despite valid
      # credentials. 15.22.1 is the last good version. Latest (15.23.0) is still
      # affected. Unpin once firebase/firebase-tools#10716 is fixed and verified.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.1

      # firebase-tools picks up the federated credentials via
      # GOOGLE_APPLICATION_CREDENTIALS, which the auth step exports.
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project opencausationorg --non-interactive
